name: Foundation CI

on:
  push:
    branches:
      - main
      - "arena/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundation-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Windows build, tests, and dependency restore
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      NUGET_XMLDOC_MODE: skip
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.0.x

      - name: Restore local .NET tools
        run: dotnet tool restore

      - name: Restore dependencies and generate package locks
        run: dotnet restore DentivaPro.sln --use-lock-file

      - name: Verify C# formatting
        run: dotnet format DentivaPro.sln --verify-no-changes --no-restore

      - name: Build Release
        run: dotnet build DentivaPro.sln --configuration Release --no-restore

      - name: Verify EF migration snapshot matches the model
        id: verify-ef-migration
        shell: pwsh
        run: |
          dotnet ef migrations has-pending-model-changes --project src/DentivaPro.Infrastructure/DentivaPro.Infrastructure.csproj --startup-project tools/DentivaPro.DbMigrations/DentivaPro.DbMigrations.csproj --no-build --verbose 2>&1 | Tee-Object -FilePath migration-check.log
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Run foundation tests
        if: ${{ success() || steps.verify-ef-migration.outcome == 'failure' }}
        run: dotnet test DentivaPro.sln --configuration Release --no-build --logger "trx;LogFileName=foundation-tests.trx"

      - name: Emit sanitized failure diagnostics
        if: failure()
        shell: pwsh
        run: |
          $diagnostics = [System.Collections.Generic.List[string]]::new()
          if (Test-Path migration-check.log) {
            $diagnostics.Add('EF migration check output:')
            $diagnostics.AddRange([string[]](Get-Content migration-check.log | Where-Object { $_ -match '(?i)error|exception|failed|unable|not found|pending model changes' -and $_ -notmatch '(?i)password|data source|connection string' } | Select-Object -Last 20))
          }
          Get-ChildItem -Path . -Recurse -Filter '*.trx' -ErrorAction SilentlyContinue | ForEach-Object {
            try {
              [xml]$report = Get-Content -Raw $_.FullName
              foreach ($result in $report.SelectNodes("//*[local-name()='UnitTestResult' and @outcome='Failed']")) {
                $name = $result.GetAttribute('testName')
                $messageNode = $result.SelectSingleNode(".//*[local-name()='ErrorInfo']/*[local-name()='Message']")
                $message = if ($messageNode) { $messageNode.InnerText } else { 'No failure message was recorded.' }
                $message = $message -replace '(?i)(password|pwd)\s*=\s*[^;\s]+', '$1=[redacted]'
                $diagnostics.Add("Test failed: $name — $message")
              }
            } catch {
              $diagnostics.Add("Unable to parse test result file $($_.Name).")
            }
          }
          if ($diagnostics.Count -eq 0) {
            $diagnostics.Add('The build or CI step failed without a captured EF or test diagnostic.')
          }
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ('### Sanitized foundation CI diagnostics' + [Environment]::NewLine + ($diagnostics -join [Environment]::NewLine))
          foreach ($diagnostic in ($diagnostics | Select-Object -First 20)) {
            $escaped = $diagnostic.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error file=.github/workflows/ci.yml,line=1,title=Foundation CI diagnostic::$escaped"
          }

      - name: Upload test evidence and generated package locks
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: foundation-ci-evidence
          path: |
            **/packages.lock.json
            **/TestResults/**/*.trx
          if-no-files-found: ignore
          retention-days: 7
